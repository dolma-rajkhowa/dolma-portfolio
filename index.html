<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>dolma | hello</title>

  <style>
    /* custom fonts */
    @font-face {
      font-family: 'Orbit';
      src: url('assets/font_orbit.ttf') format('truetype');
      font-display: swap;
    }
    @font-face {
      font-family: 'Pixlefy';
      src: url('assets/font_pixlefy.ttf') format('truetype');
      font-display: swap;
    }

    :root {
      --bg: #000000;
      --ink: #ffffff;
      --accent: #ff2e2e;
      --body: 'Orbit', sans-serif;
      --pixel: 'Pixlefy', monospace;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex; 
      flex-direction: column; 
      justify-content: center; 
      align-items: center;
      text-align: center;
      
      background: #000000 url('assets/noise1.jpg') repeat fixed center;
      background-size: cover;
      
      cursor: url('assets/port_cursor.png') 4 4, auto;
      color: var(--ink);
      font-family: var(--body);
      font-size: 1.25rem; 
      line-height: 1.5; 
      letter-spacing: .6px;
      padding: 1.5rem;
    }

    h1 {
      font-family: var(--pixel);
      font-size: 4.5rem; 
      letter-spacing: 2px;
      color: var(--accent);
      margin-bottom: 1rem;
      text-transform: lowercase;
      text-shadow: 3px 3px 6px rgba(0,0,0,0.9); 
    }

    p {
      max-width: 500px;
      margin-bottom: 1rem;
      opacity: .9;
      text-transform: lowercase;
      font-size: 1.25rem; 
      text-shadow: 2px 2px 4px rgba(0,0,0,0.9); 
    }

    .btn-container {
      margin-top: 2rem;
    }

    .btn {
      font-family: var(--pixel);
      font-size: 1.5rem; 
      letter-spacing: 1px;
      display: inline-block;
      margin: .75rem;
      padding: 1rem 2rem;
      border: 3px solid var(--accent);
      color: var(--ink);
      background: rgba(0, 0, 0, 0.6); 
      text-decoration: none;
      transition: background .3s, color .3s, transform .1s;
      text-transform: lowercase;
      text-shadow: none;
    }

    .btn:hover {
      background: var(--accent);
      color: var(--bg);
      transform: translate(3px, 3px);
    }
  </style>
</head>
<body>

  <h1>hello</h1>
  <p>hey i’m dolma, budding graphic designer exploring grainy textures, glitch aesthetics and micro animations.</p>
  <p>browse my portfolio for static & motion work, or view my résumé for background & skills.</p>
  
  <div class="btn-container">
    <a class="btn" href="portfolio.html">portfolio</a>
    <a class="btn" href="resume.html">résumé</a>
  </div>

</body>
</html>
